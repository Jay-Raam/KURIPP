scalar DateTime
scalar JSON

enum UserRole {
  OWNER
  ADMIN
  MEMBER
  VIEWER
}

enum DocumentProcessingStatus {
  UPLOADING
  UPLOADED
  QUEUED
  PROCESSING
  EXTRACTING
  CHUNKING
  EMBEDDING
  INDEXING
  READY
  FAILED
}

enum AIMode {
  ASK
  RESEARCH
  ANALYZE
}

enum WhatsAppMessageStatus {
  PENDING
  SENT
  DELIVERED
  READ
  FAILED
}

type User {
  id: ID!
  email: String!
  fullName: String!
  emailVerified: Boolean!
  avatarUrl: String
  createdAt: DateTime!
}

type AuthPayload {
  accessToken: String!
  user: User!
}

type Workspace {
  id: ID!
  organizationId: ID!
  name: String!
  slug: String!
  description: String
  role: UserRole
  createdAt: DateTime!
}

type Document {
  id: ID!
  workspaceId: ID!
  title: String!
  mimeType: String!
  fileSize: Float!
  status: DocumentProcessingStatus!
  currentVersion: Int!
  errorMessage: String
  pageCount: Int
  chunkCount: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DocumentChunk {
  id: ID!
  documentId: ID!
  workspaceId: ID!
  pageNumber: Int
  sectionHeading: String
  chunkIndex: Int!
  content: String!
  tokenCount: Int!
  createdAt: DateTime!
}

type SearchCitation {
  documentId: ID!
  documentTitle: String!
  chunkId: ID!
  pageNumber: Int
  sectionHeading: String
  content: String!
  score: Float!
}

type SearchResult {
  query: String!
  totalResults: Int!
  citations: [SearchCitation!]!
}

type ChatMessage {
  id: ID!
  sessionId: ID!
  role: String!
  content: String!
  model: String
  citations: [SearchCitation!]!
  createdAt: DateTime!
}

type ChatSession {
  id: ID!
  workspaceId: ID!
  title: String!
  mode: AIMode!
  model: String!
  messageCount: Int!
  lastMessageAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ChatSessionDetail {
  session: ChatSession!
  messages: [ChatMessage!]!
}

type OpenRouterModel {
  id: String!
  name: String!
  description: String!
  contextLength: Int!
  isFree: Boolean!
}

type WhatsAppLog {
  id: ID!
  recipientNumber: String!
  templateName: String!
  severity: String!
  contentSummary: String!
  status: WhatsAppMessageStatus!
  errorMessage: String
  sentAt: DateTime
  deliveredAt: DateTime
  readAt: DateTime
  createdAt: DateTime!
}

type SystemHealth {
  status: String!
  version: String!
  uptimeSeconds: Float!
  timestamp: DateTime!
  postgres: Boolean!
  mongodb: Boolean!
  redis: Boolean!
}

type SessionInfo {
  id: ID!
  userAgent: String
  ipHash: String
  isCurrent: Boolean!
  createdAt: DateTime!
  expiresAt: DateTime!
}

type WorkspaceMemberInfo {
  id: ID!
  workspaceId: ID!
  user: User!
  role: UserRole!
  createdAt: DateTime!
}

type AuditLogRecord {
  id: ID!
  action: String!
  resourceType: String!
  resourceId: String
  user: User
  ipHash: String
  userAgent: String
  metadata: JSON
  createdAt: DateTime!
}

type DocumentUploadPayload {
  documentId: ID!
  uploadUrl: String!
  objectKey: String!
  expiresInSeconds: Int!
}

type DocumentDownloadPayload {
  downloadUrl: String!
  expiresInSeconds: Int!
}

type Query {
  health: SystemHealth!
  me: User
  mySessions: [SessionInfo!]!
  myWorkspaces: [Workspace!]!
  workspace(id: ID!): Workspace
  workspaceMembers(workspaceId: ID!): [WorkspaceMemberInfo!]!
  auditLogs(workspaceId: ID!, limit: Int): [AuditLogRecord!]!
  openRouterModels: [OpenRouterModel!]!
  documents(workspaceId: ID!): [Document!]!
  document(id: ID!): Document
  documentDownloadUrl(id: ID!): DocumentDownloadPayload!
  documentChunks(documentId: ID!): [DocumentChunk!]!
  searchKnowledge(input: SearchKnowledgeInput!): SearchResult!
  chatSessions(workspaceId: ID!): [ChatSession!]!
  chatSession(id: ID!): ChatSessionDetail
  whatsAppLogs(limit: Int): [WhatsAppLog!]!

  # Phase 8: Collections & Research Notes
  collections(workspaceId: ID!): [Collection!]!
  collection(id: ID!): Collection
  collectionDocuments(collectionId: ID!): [Document!]!
  researchNotes(workspaceId: ID!, collectionId: ID, tag: String): [ResearchNote!]!
  researchNote(id: ID!): ResearchNote

  # Phase 9: Document Diffs, Reports & Evaluation
  documentComparisons(workspaceId: ID!): [DocumentDiffResult!]!
  documentComparison(id: ID!): DocumentDiffResult
  generatedReports(workspaceId: ID!): [GeneratedReportPayload!]!
  generatedReport(id: ID!): GeneratedReportPayload
  runAiEvaluationHarness(workspaceId: ID!): EvaluationSummary!
}

type Mutation {
  healthPing: String!
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  logout: Boolean!
  refreshToken: AuthPayload!
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!
  resetPassword(input: ResetPasswordInput!): Boolean!
  verifyEmail(token: String!): Boolean!
  revokeSession(sessionId: ID!): Boolean!

  createWorkspace(input: CreateWorkspaceInput!): Workspace!
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput!): Workspace!
  deleteWorkspace(id: ID!): Boolean!
  inviteWorkspaceMember(input: InviteMemberInput!): WorkspaceMemberInfo!
  updateMemberRole(input: UpdateMemberRoleInput!): WorkspaceMemberInfo!
  removeWorkspaceMember(workspaceId: ID!, memberId: ID!): Boolean!

  createDocumentUpload(input: CreateDocumentUploadInput!): DocumentUploadPayload!
  confirmDocumentUpload(input: ConfirmDocumentUploadInput!): Document!
  processDocument(id: ID!): Document!
  deleteDocument(id: ID!): Boolean!

  createChatSession(input: CreateChatSessionInput!): ChatSession!
  sendMessage(input: SendMessageInput!): ChatMessage!
  deleteChatSession(id: ID!): Boolean!

  # Phase 8 Mutations: Collections & Notes & Deep Research
  createCollection(input: CreateCollectionInput!): Collection!
  updateCollection(id: ID!, input: UpdateCollectionInput!): Collection!
  deleteCollection(id: ID!): Boolean!
  addDocumentToCollection(input: AddDocumentToCollectionInput!): Boolean!
  removeDocumentFromCollection(input: RemoveDocumentFromCollectionInput!): Boolean!

  createResearchNote(input: CreateResearchNoteInput!): ResearchNote!
  updateResearchNote(id: ID!, input: UpdateResearchNoteInput!): ResearchNote!
  deleteResearchNote(id: ID!): Boolean!

  runDeepResearch(input: RunDeepResearchInput!): DeepResearchSynthesis!

  # Phase 9 Mutations: Document Diff, AI Tools & Reports
  compareDocuments(input: CompareDocumentsInput!): DocumentDiffResult!
  executeAiTool(input: ExecuteAiToolInput!): ToolExecutionResult!
  generateReport(input: CreateReportInput!): GeneratedReportPayload!
  deleteReport(id: ID!): Boolean!
}

input CreateDocumentUploadInput {
  workspaceId: ID!
  title: String!
  fileName: String!
  fileSize: Float!
  mimeType: String!
}

input ConfirmDocumentUploadInput {
  documentId: ID!
  checksum: String
}

input CreateWorkspaceInput {
  name: String!
  slug: String
  description: String
}

input UpdateWorkspaceInput {
  name: String
  description: String
}

input InviteMemberInput {
  workspaceId: ID!
  email: String!
  role: UserRole!
}

input UpdateMemberRoleInput {
  workspaceId: ID!
  memberId: ID!
  role: UserRole!
}

input RegisterInput {
  email: String!
  password: String!
  fullName: String!
}

input LoginInput {
  email: String!
  password: String!
}

input RequestPasswordResetInput {
  email: String!
}

input ResetPasswordInput {
  token: String!
  newPassword: String!
}

input SearchKnowledgeInput {
  workspaceId: ID!
  query: String!
  limit: Int
}

input CreateChatSessionInput {
  workspaceId: ID!
  title: String
  mode: AIMode
  model: String
}

input SendMessageInput {
  sessionId: ID!
  workspaceId: ID!
  content: String!
  mode: AIMode
  model: String
}

# Phase 8: Collections & Research Notes Types
type Collection {
  id: ID!
  workspaceId: ID!
  name: String!
  description: String
  color: String
  documentCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ResearchNote {
  id: ID!
  workspaceId: ID!
  userId: ID!
  collectionId: ID
  title: String!
  content: String!
  tags: [String!]!
  sourceCitations: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DeepResearchSynthesis {
  id: ID!
  objective: String!
  subQueries: [String!]!
  documentsAnalyzed: Int!
  citations: [SearchCitation!]!
  synthesisMarkdown: String!
  keyFindings: [String!]!
  strategicRecommendations: [String!]!
  executionTimeMs: Int!
}

# Phase 9: Document Diff, AI Tools, Reports & Evaluation Types
type DiffSegment {
  type: String!
  text: String!
  lineNumber: Int
}

type DocumentDiffResult {
  id: ID!
  workspaceId: ID!
  baseDocumentId: ID!
  targetDocumentId: ID!
  title: String!
  summary: String!
  addedClausesCount: Int!
  removedClausesCount: Int!
  modifiedClausesCount: Int!
  segments: [DiffSegment!]!
  aiAnalysis: String!
  createdAt: DateTime!
}

type ToolExecutionResult {
  toolName: String!
  inputPayload: JSON!
  outputPayload: JSON!
  status: String!
  durationMs: Int!
}

type GeneratedReportPayload {
  id: ID!
  workspaceId: ID!
  title: String!
  format: String!
  content: String!
  metadata: JSON
  createdAt: DateTime!
}

type EvaluationMetric {
  testCaseId: String!
  query: String!
  groundednessScore: Float!
  citationPrecision: Float!
  hallucinationScore: Float!
  isPassed: Boolean!
  explanation: String!
}

type EvaluationSummary {
  totalCases: Int!
  passedCases: Int!
  averageGroundedness: Float!
  averageCitationPrecision: Float!
  averageHallucinationScore: Float!
  metrics: [EvaluationMetric!]!
}

# Inputs for Phase 8 & 9
input CreateCollectionInput {
  workspaceId: ID!
  name: String!
  description: String
  color: String
}

input UpdateCollectionInput {
  name: String
  description: String
  color: String
}

input AddDocumentToCollectionInput {
  collectionId: ID!
  documentId: ID!
}

input RemoveDocumentFromCollectionInput {
  collectionId: ID!
  documentId: ID!
}

input CreateResearchNoteInput {
  workspaceId: ID!
  collectionId: ID
  title: String!
  content: String!
  tags: [String!]
  sourceCitations: JSON
}

input UpdateResearchNoteInput {
  title: String
  content: String
  tags: [String!]
  collectionId: ID
}

input RunDeepResearchInput {
  workspaceId: ID!
  collectionId: ID
  objective: String!
  model: String
  depth: String
}

input CompareDocumentsInput {
  workspaceId: ID!
  baseDocumentId: ID!
  targetDocumentId: ID!
  title: String
}

input ExecuteAiToolInput {
  workspaceId: ID!
  toolName: String!
  parameters: JSON!
}

input CreateReportInput {
  workspaceId: ID!
  title: String!
  format: String
  prompt: String
}


