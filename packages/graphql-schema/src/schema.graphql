scalar DateTime
scalar JSON

enum UserRole {
  OWNER
  ADMIN
  MEMBER
  VIEWER
}

enum DocumentProcessingStatus {
  UPLOADING
  UPLOADED
  QUEUED
  PROCESSING
  EXTRACTING
  CHUNKING
  EMBEDDING
  INDEXING
  READY
  FAILED
}

enum AIMode {
  ASK
  RESEARCH
  ANALYZE
}

enum WhatsAppMessageStatus {
  PENDING
  SENT
  DELIVERED
  READ
  FAILED
}

type User {
  id: ID!
  email: String!
  fullName: String!
  emailVerified: Boolean!
  avatarUrl: String
  createdAt: DateTime!
}

type AuthPayload {
  accessToken: String!
  user: User!
}

type Workspace {
  id: ID!
  organizationId: ID!
  name: String!
  slug: String!
  description: String
  role: UserRole
  createdAt: DateTime!
}

type Document {
  id: ID!
  workspaceId: ID!
  title: String!
  mimeType: String!
  fileSize: Float!
  status: DocumentProcessingStatus!
  currentVersion: Int!
  errorMessage: String
  pageCount: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OpenRouterModel {
  id: String!
  name: String!
  description: String!
  contextLength: Int!
  isFree: Boolean!
}

type WhatsAppLog {
  id: ID!
  recipientNumber: String!
  templateName: String!
  severity: String!
  contentSummary: String!
  status: WhatsAppMessageStatus!
  errorMessage: String
  sentAt: DateTime
  deliveredAt: DateTime
  readAt: DateTime
  createdAt: DateTime!
}

type SystemHealth {
  status: String!
  version: String!
  uptimeSeconds: Float!
  timestamp: DateTime!
  postgres: Boolean!
  mongodb: Boolean!
  redis: Boolean!
}

type SessionInfo {
  id: ID!
  userAgent: String
  ipHash: String
  isCurrent: Boolean!
  createdAt: DateTime!
  expiresAt: DateTime!
}

type WorkspaceMemberInfo {
  id: ID!
  workspaceId: ID!
  user: User!
  role: UserRole!
  createdAt: DateTime!
}

type AuditLogRecord {
  id: ID!
  action: String!
  resourceType: String!
  resourceId: String
  user: User
  ipHash: String
  userAgent: String
  metadata: JSON
  createdAt: DateTime!
}

type DocumentUploadPayload {
  documentId: ID!
  uploadUrl: String!
  objectKey: String!
  expiresInSeconds: Int!
}

type DocumentDownloadPayload {
  downloadUrl: String!
  expiresInSeconds: Int!
}

type Query {
  health: SystemHealth!
  me: User
  mySessions: [SessionInfo!]!
  myWorkspaces: [Workspace!]!
  workspace(id: ID!): Workspace
  workspaceMembers(workspaceId: ID!): [WorkspaceMemberInfo!]!
  auditLogs(workspaceId: ID!, limit: Int): [AuditLogRecord!]!
  openRouterModels: [OpenRouterModel!]!
  documents(workspaceId: ID!): [Document!]!
  document(id: ID!): Document
  documentDownloadUrl(id: ID!): DocumentDownloadPayload!
  whatsAppLogs(limit: Int): [WhatsAppLog!]!
}

type Mutation {
  healthPing: String!
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  logout: Boolean!
  refreshToken: AuthPayload!
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!
  resetPassword(input: ResetPasswordInput!): Boolean!
  verifyEmail(token: String!): Boolean!
  revokeSession(sessionId: ID!): Boolean!

  createWorkspace(input: CreateWorkspaceInput!): Workspace!
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput!): Workspace!
  deleteWorkspace(id: ID!): Boolean!
  inviteWorkspaceMember(input: InviteMemberInput!): WorkspaceMemberInfo!
  updateMemberRole(input: UpdateMemberRoleInput!): WorkspaceMemberInfo!
  removeWorkspaceMember(workspaceId: ID!, memberId: ID!): Boolean!

  createDocumentUpload(input: CreateDocumentUploadInput!): DocumentUploadPayload!
  confirmDocumentUpload(input: ConfirmDocumentUploadInput!): Document!
  deleteDocument(id: ID!): Boolean!
}

input CreateDocumentUploadInput {
  workspaceId: ID!
  title: String!
  fileName: String!
  fileSize: Float!
  mimeType: String!
}

input ConfirmDocumentUploadInput {
  documentId: ID!
  checksum: String
}

input CreateWorkspaceInput {
  name: String!
  slug: String
  description: String
}

input UpdateWorkspaceInput {
  name: String
  description: String
}

input InviteMemberInput {
  workspaceId: ID!
  email: String!
  role: UserRole!
}

input UpdateMemberRoleInput {
  workspaceId: ID!
  memberId: ID!
  role: UserRole!
}

input RegisterInput {
  email: String!
  password: String!
  fullName: String!
}

input LoginInput {
  email: String!
  password: String!
}

input RequestPasswordResetInput {
  email: String!
}

input ResetPasswordInput {
  token: String!
  newPassword: String!
}


