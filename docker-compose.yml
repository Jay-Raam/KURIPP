services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kuripp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kuripp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuripp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MongoDB 7 for Conversational & AI Execution History
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: kuripp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Redis 7 for Cache, Rate Limiting, Pub/Sub, and BullMQ Queues
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: kuripp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Mailpit for Zero-Leakage Local SMTP Testing
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: kuripp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web Dashboard
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: ""

  # -------------------------------------------------------------------------
  # MinIO for Local S3-Compatible Object Storage (R2 Emulation)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: kuripp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  minio-data:
